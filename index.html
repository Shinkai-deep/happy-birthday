<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#02040d" />
  <meta name="description" content="为而作的梦幻粉蓝星尘 3D 粒子生日蛋糕" />
  <title>Happy Birthday · </title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23030713'/%3E%3Cpath d='M7 21h18M9 15h14M12 9h8' stroke='%23b9eaff' stroke-width='2.3' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='6' r='2' fill='%23ffd0e6'/%3E%3C/svg%3E" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Noto+Sans+SC:wght@400;600&display=swap');
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background:
        radial-gradient(ellipse at 78% 28%, rgba(38, 91, 176, .28) 0%, rgba(20, 42, 99, .10) 30%, transparent 56%),
        radial-gradient(ellipse at 18% 72%, rgba(156, 48, 108, .18) 0%, rgba(71, 24, 66, .08) 31%, transparent 57%),
        radial-gradient(ellipse at 50% 108%, rgba(44, 67, 138, .28) 0%, transparent 48%),
        linear-gradient(160deg, #01030b 0%, #05091a 48%, #08081b 74%, #120a18 100%);
    }
    body { font-family: Montserrat, Arial, sans-serif; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 48%, transparent 25%, rgba(1,3,12,.14) 58%, rgba(0,1,7,.72) 112%); box-shadow: inset 0 0 12vw rgba(0,0,8,.48); }
    .title, .signature { position: fixed; left: 50%; z-index: 2; pointer-events: none; text-align: center; }
    .title {
      top: clamp(4.5vh, 7vh, 9vh); transform: translateX(-50%);
      font-size: clamp(1.9rem, 4.5vw, 3.75rem); font-weight: 700; letter-spacing: -.025em; white-space: nowrap;
      background: linear-gradient(100deg, #a8eaff 15%, #dff8ff 52%, #ffc0dc 88%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 8px rgba(153,224,255,.32)) drop-shadow(0 0 18px rgba(255,183,220,.20));
      animation: text-breathe 5.5s ease-in-out infinite;
    }
    .signature { bottom: clamp(3vh, 5vh, 7vh); transform: translateX(-50%); animation: text-breathe 6.5s ease-in-out infinite; }
    .signature .name { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .signature .name-main { font-family: "Noto Sans SC", Arial, sans-serif; font-weight: 600; font-size: clamp(.95rem, 1.75vw, 1.34rem); letter-spacing: .12em; margin-right: -.12em; white-space: nowrap; color: #c8efff; text-shadow: 0 0 7px rgba(139,218,255,.58), 0 0 14px rgba(255,150,202,.3); }
    .signature .credit { font-family: Montserrat, Arial, sans-serif; font-size: clamp(.68rem, 1vw, .78rem); font-style: normal; font-weight: 600; letter-spacing: .06em; color: rgba(255,192,220,.82); text-shadow: 0 0 7px rgba(139,218,255,.4); }
    .noscript { color: white; padding: 2rem; }
    @keyframes text-breathe { 0%,100% { filter: drop-shadow(0 0 7px rgba(153,224,255,.28)); } 50% { filter: drop-shadow(0 0 13px rgba(255,190,222,.48)); } }
    @media (max-height: 620px) { .title { top: 3vh; font-size: clamp(1.8rem, 7vh, 2.8rem); } .signature { bottom: 3vh; } }
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
  <canvas id="scene" aria-label="由粉蓝色星尘凝聚成的三层 3D 生日蛋糕动画"></canvas>
  <div class="vignette"></div>
  <div class="title">Happy Birthday!</div>
  <div class="signature"><span class="name"><span class="name-main">祝生日快乐～</span><em class="credit">by：小秦</em></span></div>
  <noscript><div class="noscript">请启用 JavaScript 观看 3D 星尘生日蛋糕。</div></noscript>
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const canvas = document.querySelector('#scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x02040d, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    const bgCanvas=document.createElement('canvas'); bgCanvas.width=bgCanvas.height=1024;
    const bg=bgCanvas.getContext('2d'); bg.fillStyle='#02050f'; bg.fillRect(0,0,1024,1024);
    const blueGlow=bg.createRadialGradient(785,260,0,785,260,560); blueGlow.addColorStop(0,'rgba(35,78,158,.42)');blueGlow.addColorStop(.42,'rgba(13,31,78,.20)');blueGlow.addColorStop(1,'rgba(1,4,14,0)');bg.fillStyle=blueGlow;bg.fillRect(0,0,1024,1024);
    const pinkGlow=bg.createRadialGradient(180,760,0,180,760,510); pinkGlow.addColorStop(0,'rgba(120,34,89,.28)');pinkGlow.addColorStop(.5,'rgba(52,17,51,.12)');pinkGlow.addColorStop(1,'rgba(0,0,0,0)');bg.fillStyle=pinkGlow;bg.fillRect(0,0,1024,1024);
    const lowGlow=bg.createRadialGradient(520,1080,0,520,1080,600);lowGlow.addColorStop(0,'rgba(31,69,125,.30)');lowGlow.addColorStop(1,'rgba(0,0,0,0)');bg.fillStyle=lowGlow;bg.fillRect(0,0,1024,1024);
    for(let i=0;i<180;i++){const x=Math.random()*1024,y=Math.random()*1024,r=Math.random()<.92?.3+Math.random()*.7:1.5;bg.fillStyle=`rgba(${Math.random()>.55?'165,222,255':'255,182,218'},${Math.random()*.38+.12})`;bg.beginPath();bg.arc(x,y,r,0,Math.PI*2);bg.fill();}
    const bgTexture=new THREE.CanvasTexture(bgCanvas);bgTexture.colorSpace=THREE.SRGBColorSpace;scene.background=bgTexture;
    scene.fog = new THREE.FogExp2(0x02040d, .028);
    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, .1, 100);
    camera.position.set(3.35, 3.1, 14.6);
    camera.lookAt(0, -.25, 0);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .30, .48, .62);
    composer.addPass(bloom);

    const cake = new THREE.Group();
    cake.position.y = -.85;
    scene.add(cake);

    const palette = [new THREE.Color('#2f7fe5'), new THREE.Color('#6fdcff'), new THREE.Color('#e7629c'), new THREE.Color('#ff9bc3'), new THREE.Color('#eafaff')];
    const positions = [], origins = [], colors = [], sizes = [], seeds = [];
    const rand = (a,b) => a + Math.random() * (b-a);
    function pushParticle(x,y,z, emphasis=0, colorBias=null, colorBias2=null, blendT=0, sizeScale=1) {
      positions.push(x,y,z);
      const theta = Math.random()*Math.PI*2, rad = rand(7.5,15), oy=rand(-6,7);
      origins.push(Math.cos(theta)*rad, oy, Math.sin(theta)*rad);
      const c1 = colorBias || palette[1];
      const c2 = colorBias2 || c1;
      const t = Math.min(1, Math.max(0, blendT + rand(-.12,.12)));
      const base = c1.clone().lerp(c2, t);
      const jitter = rand(.80,.96);
      const tint = rand(-.05,.05);
      colors.push(
        Math.min(1, Math.max(0, base.r*jitter + tint)),
        Math.min(1, Math.max(0, base.g*jitter + tint)),
        Math.min(1, Math.max(0, base.b*jitter + tint))
      );
      const crystal=Math.random()<.105?rand(3.0,5.15):rand(.78,2.18);
      sizes.push((crystal + emphasis)*sizeScale); seeds.push(Math.random());
    }

    function tier(radius, height, cy, count, sizeScale, colorBottom, colorTop) {
      for(let i=0;i<count;i++){
        const face=Math.random(), a=Math.random()*Math.PI*2; let r,y,emphasis=0;
        if(face<.52){
          r=radius+rand(-.038,.042);
          y=cy+rand(-height/2,height/2);
          emphasis=0.08;
        }
        else if(face<.76){
          const edgeBias=Math.random()>.35;
          r=edgeBias?radius*(.9+Math.random()*.1):radius*Math.sqrt(Math.random());
          y=cy+(Math.random()>.14?height/2:-height/2)+rand(-.038,.038);
          emphasis=edgeBias?0.10:0;
        }
        else {
          r=radius*Math.sqrt(Math.random());
          y=cy+rand(-height*.48,height*.48);
        }
        const localT = (y - (cy - height/2)) / height;
        pushParticle(Math.cos(a)*r,y,Math.sin(a)*r,emphasis,colorBottom,colorTop,localT,sizeScale);
      }
      const rimCount=Math.floor(count*.22);
      const white = new THREE.Color('#ffffff');
      for(let i=0;i<rimCount;i++){
        const a=Math.random()*Math.PI*2;
        const r=radius+rand(-.10,.14);
        const y=cy+(Math.random()>.5?1:-1)*(height*.5)+rand(-.10,.10);
        const localT = (y - (cy - height/2)) / height;
        if (Math.random() < 0.15) {
          pushParticle(Math.cos(a)*r, y, Math.sin(a)*r, .75, white, white, 0, sizeScale * 1.18);
        } else {
          pushParticle(Math.cos(a)*r, y, Math.sin(a)*r, .55, colorBottom, colorTop, localT, sizeScale * 1.08);
        }
      }
      const waistCount=Math.floor(count*.08);
      for(let i=0;i<waistCount;i++){
        const a=Math.random()*Math.PI*2;
        const r=radius+rand(-.04,.05);
        const y=cy+rand(-.03,.03);
        const localT = (y - (cy - height/2)) / height;
        pushParticle(Math.cos(a)*r,y,Math.sin(a)*r,.45,colorBottom,colorTop,localT,sizeScale*1.05);
      }
    }
    tier(3.20,1.34,-1.28,15000,1.16,palette[0],palette[1]);
    tier(2.28,1.36,.17,11500,1.00,palette[1],palette[3]);
    tier(1.46,1.34,1.62,8500,.84,palette[3],palette[4]);

    const coreMat=new THREE.MeshBasicMaterial({color:0x173d69,transparent:true,opacity:.14,depthWrite:false});
    [[2.98,1.24,-1.28],[2.10,1.25,.17],[1.34,1.23,1.62]].forEach(([r,h,y])=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,64),coreMat);m.position.y=y;cake.add(m);});

    const geom=new THREE.BufferGeometry();
    geom.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
    geom.setAttribute('aOrigin',new THREE.Float32BufferAttribute(origins,3));
    geom.setAttribute('aColor',new THREE.Float32BufferAttribute(colors,3));
    geom.setAttribute('aSize',new THREE.Float32BufferAttribute(sizes,1));
    geom.setAttribute('aSeed',new THREE.Float32BufferAttribute(seeds,1));
    const pointMat=new THREE.ShaderMaterial({
      uniforms:{uTime:{value:0},uProgress:{value:0},uPixel:{value:renderer.getPixelRatio()}},
      vertexShader:`
        uniform float uTime,uProgress,uPixel; attribute vec3 aOrigin,aColor; attribute float aSize,aSeed; varying vec3 vColor; varying float vAlpha,vSeed;
        float ease(float x){return 1.-pow(1.-x,3.);}
        void main(){
          float delay=aSeed*.32; float p=clamp((uProgress-delay)/(1.-delay),0.,1.); p=ease(p);
          vec3 target=position; float drift=sin(uTime*.72+aSeed*31.)*.018;
          target += normalize(position+vec3(.001))*drift;
          target.y += sin(uTime*.45+aSeed*51.)*.014;
          vec3 pos=mix(aOrigin,target,p);
          vec4 mv=modelViewMatrix*vec4(pos,1.); gl_Position=projectionMatrix*mv;
          gl_PointSize=aSize*uPixel*(42./-mv.z)*(1.+.18*sin(uTime*1.7+aSeed*60.));
          vColor=aColor; vSeed=aSeed; vAlpha=p*(.64+.36*sin(uTime*1.35+aSeed*91.)*.5+.18);
        }`,
      fragmentShader:`
        varying vec3 vColor; varying float vAlpha,vSeed;
        void main(){vec2 p=gl_PointCoord-.5; float d=length(p); if(d>.5)discard; float mask=smoothstep(.5,.41,d); float core=pow(max(0.,1.-d*1.72),2.); gl_FragColor=vec4(vColor*(.92+core*.10),vAlpha*mask*.90);}`,
      transparent:true,depthWrite:false,blending:THREE.NormalBlending,vertexColors:true
    });
    cake.add(new THREE.Points(geom,pointMat));

    // A fully particle-built five-point star replaces the candle.
    const star=new THREE.Group(); star.position.y=2.68; cake.add(star);
    const sp=[],sc=[];
    for(let i=0;i<1450;i++){
      const a=Math.random()*Math.PI*2-Math.PI/2;
      const seg=(a+Math.PI/2+Math.PI*2)%(Math.PI*2)/(Math.PI/5);
      const f=seg-Math.floor(seg), even=Math.floor(seg)%2===0;
      const r0=even?.52:.23, r1=even?.23:.52;
      const edge=r0+(r1-r0)*f, r=Math.sqrt(Math.random())*edge;
      sp.push(Math.cos(a)*r,Math.sin(a)*r,rand(-.12,.12));
      const c=Math.random()<.58?palette[1]:Math.random()<.72?palette[3]:palette[4];sc.push(c.r,c.g,c.b);
    }
    const sGeo=new THREE.BufferGeometry();sGeo.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));sGeo.setAttribute('color',new THREE.Float32BufferAttribute(sc,3));
    const sMat=new THREE.PointsMaterial({size:.052,transparent:true,opacity:.88,vertexColors:true,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
    star.add(new THREE.Points(sGeo,sMat));
    const glow=new THREE.PointLight(0x79ddff,1.05,4,2);star.add(glow);

    // Sparse deep-space field with real parallax.
    function starField(count, spread, size, opacity){
      const p=[],c=[]; for(let i=0;i<count;i++){p.push(rand(-spread,spread),rand(-spread*.62,spread*.62),rand(-10,3)); const col=palette[Math.floor(Math.random()*4)];c.push(col.r,col.g,col.b)}
      const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));
      const m=new THREE.PointsMaterial({size,opacity,transparent:true,depthWrite:false,vertexColors:true,blending:THREE.AdditiveBlending,sizeAttenuation:true}); const pts=new THREE.Points(g,m);scene.add(pts);return pts;
    }
    const farStars=starField(190,18,.05,.46), nearDust=starField(52,13,.095,.34);
    const fp=[],fc=[];
    for(let i=0;i<220;i++){const a=Math.random()*Math.PI*2,r=rand(3.45,5.35),y=rand(-2.7,2.65);fp.push(Math.cos(a)*r,y,Math.sin(a)*r);const c=Math.random()>.48?palette[1]:palette[3];fc.push(c.r,c.g,c.b);}
    const fGeo=new THREE.BufferGeometry();fGeo.setAttribute('position',new THREE.Float32BufferAttribute(fp,3));fGeo.setAttribute('color',new THREE.Float32BufferAttribute(fc,3));
    const cakeDust=new THREE.Points(fGeo,new THREE.PointsMaterial({size:.045,transparent:true,opacity:.5,depthWrite:false,vertexColors:true,blending:THREE.AdditiveBlending,sizeAttenuation:true}));cakeDust.position.y=-.55;scene.add(cakeDust);
    const orbitalRings=[];
    function makeOrbit(radius,y,tilt,count,size,opacity){
      const p=[],c=[];for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,r=radius+rand(-.18,.18);p.push(Math.cos(a)*r,rand(-.055,.055),Math.sin(a)*r);const col=Math.random()>.5?palette[1]:palette[3];c.push(col.r,col.g,col.b);}
      const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));
      const pts=new THREE.Points(g,new THREE.PointsMaterial({size,transparent:true,opacity,depthWrite:false,vertexColors:true,blending:THREE.AdditiveBlending,sizeAttenuation:true}));pts.position.y=y;pts.rotation.x=tilt;scene.add(pts);orbitalRings.push(pts);return pts;
    }
    makeOrbit(4.15,-1.45,.12,170,.090,.62);
    makeOrbit(3.45,.05,-.18,135,.070,.52);
    makeOrbit(2.75,1.35,.20,105,.065,.46);

    let start=performance.now();
    function animate(now){
      requestAnimationFrame(animate); const t=(now-start)/1000;
      pointMat.uniforms.uTime.value=t; pointMat.uniforms.uProgress.value=1.;
      star.scale.setScalar(1.+.055*Math.sin(t*2.15)); star.rotation.z=Math.sin(t*.7)*.045;
      glow.intensity=.95+.14*Math.sin(t*2.4);
      cake.rotation.y=t*Math.PI*2/18;
      star.rotation.y=-cake.rotation.y;
      const baseScale=innerWidth/innerHeight<1.1?.82:1.;
      cake.scale.setScalar(baseScale*(1+Math.sin(t*.35)*.016));
      camera.position.z=15.2+Math.sin(t*.23)*.25;
      farStars.rotation.y=t*.0015; nearDust.rotation.y=-t*.003;
      nearDust.position.y=Math.sin(t*.1)*.18;
      cakeDust.rotation.y=-t*.018; cakeDust.position.y=-.55+Math.sin(t*.28)*.12;
      orbitalRings[0].rotation.y=t*.12;orbitalRings[1].rotation.y=-t*.16;orbitalRings[2].rotation.y=t*.19;
      bloom.strength=.27+.025*Math.sin(t*.45);
      composer.render();
    }
    requestAnimationFrame(animate);

    addEventListener('resize',()=>{
      camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      layoutCamera();
      renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
      renderer.setSize(innerWidth,innerHeight);
      composer.setSize(innerWidth,innerHeight);
      pointMat.uniforms.uPixel.value=renderer.getPixelRatio();
    });
  </script>
</body>
</html>
